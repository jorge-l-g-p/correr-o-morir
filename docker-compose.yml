version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: correr_morir_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       correr_morir
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # REQUERIDO — definir en .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde localhost, no expuesto a internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: jorluis/correr-o-morir-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: correr_morir_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:         3000
      DB_HOST:      db
      DB_PORT:      5432
      DB_NAME:      correr_morir
      DB_USER:      postgres
      DB_PASSWORD:  ${DB_PASSWORD}        # viene del .env
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NODE_ENV:     production
    expose:
      - "3000"   # solo accesible internamente, no expuesto al host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: jorluis/correr-o-morir-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: correr_morir_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
